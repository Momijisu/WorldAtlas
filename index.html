<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WorldAtlas</title>
  <meta name="description" content="A personal worldbuilding wiki that works offline and syncs through your OneDrive.">
  <meta name="theme-color" content="#161411">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/maps.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/version.js"></script>
  <script src="vendor/marked.min.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
    <a class="brand" href="#/"><img src="icons/icon.svg" alt=""><span>World<b>Atlas</b></span></a>
    <form id="searchForm" role="search"><input id="searchInput" type="search" placeholder="Search…  ( / )" aria-label="Search"></form>
    <button class="btn small primary" id="installTop" hidden title="Install WorldAtlas as an app">Install</button>
    <button class="icon-btn" id="newBtn" aria-label="New article" title="New article"></button>
    <button class="sync-badge off" id="syncBtn" aria-label="Sync status"></button>
  </header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <div id="scrim"></div>
    <main id="view"><div class="loading">Opening the atlas…</div></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
