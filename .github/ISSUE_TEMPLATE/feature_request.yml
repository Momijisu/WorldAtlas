name: Feature request
description: An idea for something WorldAtlas could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please check the [roadmap](https://github.com/Momijisu/WorldAtlas#roadmap) and existing issues first.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe it in terms of your world, game or story, not only the button you'd like. There's often more than one way to solve it.
      placeholder: e.g. When I prep a session I want to see every place my players haven't visited yet…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: Optional. Sketches and screenshots of other tools are welcome.
  - type: textarea
    id: today
    attributes:
      label: How do you manage today?
      description: Optional. Any workaround you use now.
